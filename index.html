<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      window.addEventListener(
        'error',
        function (event) {
          var src = (event && event.filename) || '';
          var stack = (event && event.error && event.error.stack) || '';
          if (
            src.indexOf('chrome-extension://') === 0 ||
            stack.indexOf('chrome-extension://') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        },
        true
      );
      window.addEventListener(
        'unhandledrejection',
        function (event) {
          var reason = event && event.reason;
          var stack = (reason && reason.stack) || '';
          if (stack.indexOf('chrome-extension://') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        },
        true
      );
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuestra Historia — Dedicatoria de Amor</title>
    <meta
      name="description"
      content="Página interactiva de dedicación romántica con contador de tiempo juntos, lista de recuerdos compartidos, galería de fotos con mensajes ocultos y música de fondo personalizada."
    />
    <meta property="og:title" content="Nuestra Historia — Dedicatoria de Amor" />
    <meta
      property="og:description"
      content="Un archivo íntimo de nuestros momentos: contador en vivo, recuerdos compartidos, galería con mensajes secretos y música personalizada."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Dancing+Script:wght@500;600;700&family=Geist+Mono:wght@400;500&family=Geist:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
